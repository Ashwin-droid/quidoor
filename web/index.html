<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quidoor — play the checkpoint</title>
<style>
:root {
  --bg: #171310;
  --panel: #201a15;
  --panel-2: #261f18;
  --line: #372a1e;
  --ink: #e9ddc8;
  --ink-dim: #9c8b73;
  --amber: #e3a24f;
  --amber-dim: #8a6534;
  --danger: #d96c4f;
  --board-frame: #2a2018;
  --cell: #a47a52;
  --cell-hi: #b98f63;
  --groove: #221912;
  --wall: #ebd9ac;
  --p0: #f5ebd7;
  --p1: #2b1f17;
  --sq: clamp(30px, 5.4vmin, 52px);
  --gap: clamp(7px, 1.35vmin, 13px);
  --mono: "SF Mono", "Cascadia Code", "JetBrains Mono", "Fira Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.45;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px 20px 30px;
}
button, select {
  font: inherit;
  color: inherit;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 6px 12px;
  cursor: pointer;
}
button:hover { border-color: var(--amber-dim); }
button:focus-visible, select:focus-visible, .hit:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
button.primary { background: var(--amber); color: #201505; border-color: var(--amber); font-weight: 700; }

header {
  width: 100%;
  max-width: 1060px;
  display: flex;
  align-items: baseline;
  gap: 14px;
  flex-wrap: wrap;
  padding-bottom: 14px;
}
.wordmark {
  font-family: Georgia, "Times New Roman", serif;
  font-size: 26px;
  letter-spacing: 0.34em;
  font-weight: 400;
  color: var(--ink);
}
.wordmark span { color: var(--amber); }
#engine-line { color: var(--ink-dim); font-size: 12px; }
header .spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; font-size: 12px; }
.controls label { color: var(--ink-dim); }

main {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  flex-wrap: wrap;
  justify-content: center;
}

/* ---------- eval bar ---------- */
.evalbar-wrap { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.evalbar {
  position: relative;
  width: 26px;
  height: calc(9 * var(--sq) + 8 * var(--gap) + 24px);
  background: var(--p1);
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.evalbar .fill {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 50%;
  background: var(--p0);
  transition: height 600ms cubic-bezier(.2,.8,.2,1);
}
.evalbar .zero {
  position: absolute;
  left: 0; right: 0; top: 50%;
  border-top: 1px dashed rgba(227,162,79,.75);
}
.evalbar-score {
  font-size: 13px;
  font-weight: 700;
  color: var(--amber);
  min-height: 20px;
}
.evalbar-score.mate { color: var(--danger); }

/* ---------- board ---------- */
.board-wrap { display: flex; flex-direction: column; gap: 8px; }
.board-frame {
  background: var(--board-frame);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: calc(var(--gap) + 6px);
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
}
.board {
  position: relative;
  display: grid;
  grid-template-columns: repeat(8, var(--sq) var(--gap)) var(--sq);
  grid-template-rows: repeat(8, var(--sq) var(--gap)) var(--sq);
  background: var(--groove);
  border-radius: 4px;
}
.cell {
  background: var(--cell);
  border-radius: 3px;
  position: relative;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.10), inset 0 -2px 3px rgba(0,0,0,.18);
}
.cell.last { box-shadow: inset 0 0 0 2px var(--amber), inset 0 -2px 3px rgba(0,0,0,.18); }
.cell.dest { cursor: pointer; }
.cell.dest::after {
  content: "";
  position: absolute;
  inset: 34%;
  border-radius: 50%;
  background: rgba(32,21,5,.42);
}
.cell.dest:hover { background: var(--cell-hi); }

.pawn {
  position: absolute;
  inset: 14%;
  border-radius: 50%;
  transition: transform 220ms ease;
}
.pawn.p0 {
  background: radial-gradient(circle at 34% 30%, #fffaf0, var(--p0) 55%, #cdbd9c);
  box-shadow: 0 3px 6px rgba(0,0,0,.45), inset 0 0 0 2px #8c7a5c;
}
.pawn.p1 {
  background: radial-gradient(circle at 34% 30%, #5a4430, var(--p1) 60%, #140d08);
  box-shadow: 0 3px 6px rgba(0,0,0,.55), inset 0 0 0 2px var(--amber-dim);
}

.wall { background: var(--wall); border-radius: 3px; box-shadow: 0 2px 5px rgba(0,0,0,.5); z-index: 1; }
.wall.last { box-shadow: 0 0 0 2px var(--amber), 0 2px 5px rgba(0,0,0,.5); }

.hit { z-index: 2; cursor: pointer; border: 0; background: transparent; padding: 0; border-radius: 3px; }
.hit.v { z-index: 3; }
.hit:hover, .hit.preview { background: rgba(235,217,172,.45); box-shadow: 0 0 10px rgba(227,162,79,.5); }

.files, .ranks { color: var(--ink-dim); font-size: 11px; user-select: none; }
.files { display: grid; grid-template-columns: repeat(8, var(--sq) var(--gap)) var(--sq); padding: 0 calc(var(--gap) + 7px); }
.files div { text-align: center; }

/* ---------- side panel ---------- */
aside {
  width: 300px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 12px 14px;
}
.card h2 {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-bottom: 8px;
}
#status { font-size: 14px; min-height: 22px; }
#status.thinking { color: var(--amber); }
#status.over { color: var(--danger); font-weight: 700; }

#score {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: .02em;
}
#score.mate { color: var(--danger); }
#score-note, .netline { color: var(--ink-dim); font-size: 12px; margin-top: 2px; }

.walls-row { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 12px; }
.walls-row .who { color: var(--ink-dim); }
.slats { display: inline-flex; gap: 2px; margin-left: 6px; vertical-align: middle; }
.slats i { width: 4px; height: 13px; background: var(--wall); border-radius: 1px; display: inline-block; }
.slats i.spent { background: var(--line); }

#toplines { display: flex; flex-direction: column; gap: 5px; }
.topline { display: grid; grid-template-columns: 52px 1fr 48px; gap: 8px; align-items: center; font-size: 12px; }
.topline .bar { height: 5px; background: var(--panel-2); border-radius: 3px; overflow: hidden; }
.topline .bar i { display: block; height: 100%; background: var(--amber); }
.topline .pct { text-align: right; color: var(--ink-dim); }

#history {
  max-height: 200px;
  overflow-y: auto;
  font-size: 12.5px;
  display: grid;
  grid-template-columns: 34px 1fr 1fr;
  gap: 2px 10px;
}
#history .num { color: var(--ink-dim); }
#history .hm { color: var(--ink); }
#history .em { color: var(--amber); }

#error { color: var(--danger); font-size: 12px; min-height: 16px; }

footer { padding-top: 14px; color: var(--ink-dim); font-size: 11px; }

@media (prefers-reduced-motion: reduce) {
  .evalbar .fill, .pawn { transition: none; }
}
@media (max-width: 760px) {
  aside { width: min(100%, 480px); }
}
</style>
</head>
<body>
<header>
  <div class="wordmark">QUID<span>O</span>OR</div>
  <div id="engine-line">loading engine…</div>
  <div class="spacer"></div>
  <div class="controls">
    <label for="side">you play</label>
    <select id="side">
      <option value="0" selected>first (bottom)</option>
      <option value="1">second (top)</option>
    </select>
    <label for="sims">sims</label>
    <select id="sims">
      <option>64</option>
      <option>128</option>
      <option selected>256</option>
      <option>512</option>
      <option>1024</option>
    </select>
    <button class="primary" id="new-game">New game</button>
  </div>
</header>

<main>
  <div class="evalbar-wrap">
    <div class="evalbar-score" id="bar-score">0</div>
    <div class="evalbar" title="Evaluation from the bottom player's side. +100 = one move ahead; Mxx = forced win.">
      <div class="fill" id="bar-fill"></div>
      <div class="zero"></div>
    </div>
  </div>

  <div class="board-wrap">
    <div class="board-frame"><div class="board" id="board"></div></div>
    <div class="files" id="files"></div>
  </div>

  <aside>
    <div class="card">
      <div id="status">starting…</div>
      <div id="error"></div>
    </div>
    <div class="card">
      <h2>Evaluation</h2>
      <div id="score">0</div>
      <div id="score-note">+100 = one move of shortest-path advantage for the bottom player</div>
      <div class="netline" id="netline"></div>
      <div class="walls-row" id="walls-row"></div>
    </div>
    <div class="card">
      <h2>Engine search</h2>
      <div id="toplines"><span class="netline">plays after the engine's first move</span></div>
    </div>
    <div class="card">
      <h2>Moves</h2>
      <div id="history"></div>
    </div>
  </aside>
</main>

<footer>click a marked square to move · hover a groove to place a wall</footer>

<script>
"use strict";

const $ = (id) => document.getElementById(id);
const state = { session: null, data: null, busy: false };

const FILES = "abcdefghi";
const cellName = (r, c) => FILES[c] + (r + 1);

// engine row r (rank r+1): rank 9 renders at grid row 1, rank 1 at row 17
const gridRowOfCell = (r) => 2 * (8 - r) + 1;
const gridColOfCell = (c) => 2 * c + 1;

function setStatus(text, cls) {
  const el = $("status");
  el.textContent = text;
  el.className = cls || "";
}

function setError(text) { $("error").textContent = text || ""; }

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function evalFraction(ev) {
  if (ev.kind === "mate") return ev.winner === 0 ? 1 : 0;
  return 1 / (1 + Math.exp(-ev.cp / 180));
}

function renderEval(d) {
  const ev = d.eval;
  const frac = evalFraction(ev);
  $("bar-fill").style.height = (frac * 100).toFixed(1) + "%";
  const mate = ev.kind === "mate";
  $("bar-score").textContent = ev.text;
  $("bar-score").className = "evalbar-score" + (mate ? " mate" : "");
  $("score").textContent = ev.text;
  $("score").className = mate ? "mate" : "";
  $("score-note").textContent = mate
    ? (ev.winner === 0 ? "bottom" : "top") + " player wins in " + ev.mate_in + (ev.mate_in === 1 ? " move" : " moves")
    : "+100 = one move of shortest-path advantage for the bottom player";
  $("netline").textContent =
    "net " + d.net.name + " value " + (d.net.value >= 0 ? "+" : "") + d.net.value.toFixed(3) +
    (d.net.score_text ? " · net eval " + d.net.score_text : "");

  const row = $("walls-row");
  row.innerHTML = "";
  for (const p of [0, 1]) {
    const div = document.createElement("div");
    const who = p === d.human ? "you" : "engine";
    let slats = "";
    for (let i = 0; i < 10; i++) slats += "<i" + (i < d.walls_left[p] ? "" : ' class="spent"') + "></i>";
    div.innerHTML = '<span class="who">' + (p === 0 ? "bottom" : "top") + " (" + who + ")</span>" +
      '<span class="slats">' + slats + "</span> " + d.walls_left[p];
    row.appendChild(div);
  }
}

function renderTopLines(d) {
  const box = $("toplines");
  box.innerHTML = "";
  if (!d.search_top || !d.search_top.length) {
    box.innerHTML = '<span class="netline">appears after the engine’s first move</span>';
    return;
  }
  for (const item of d.search_top) {
    const row = document.createElement("div");
    row.className = "topline";
    row.innerHTML =
      "<span>" + item.label + "</span>" +
      '<span class="bar"><i style="width:' + (item.prob * 100).toFixed(1) + '%"></i></span>' +
      '<span class="pct">' + (item.prob * 100).toFixed(1) + "%</span>";
    box.appendChild(row);
  }
}

function renderHistory(d) {
  const box = $("history");
  box.innerHTML = "";
  const hist = d.history || [];
  for (let i = 0; i < hist.length; i += 2) {
    const num = document.createElement("span");
    num.className = "num";
    num.textContent = (i / 2 + 1) + ".";
    box.appendChild(num);
    for (const m of [hist[i], hist[i + 1]]) {
      const el = document.createElement("span");
      if (m) {
        el.className = m.by === "human" ? "hm" : "em";
        el.textContent = m.label;
      }
      box.appendChild(el);
    }
  }
  box.scrollTop = box.scrollHeight;
}

function lastMoveOf(d) {
  const hist = d.history || [];
  return hist.length ? hist[hist.length - 1] : null;
}

function renderBoard(d) {
  const board = $("board");
  board.innerHTML = "";
  const last = lastMoveOf(d);
  const humanTurn = !state.busy && d.winner === null && !d.draw && d.to_move === d.human;

  const destByCell = new Map();
  const wallMoves = [];
  if (humanTurn) {
    for (const m of d.legal) {
      if (m.kind === "pawn" && m.dest) destByCell.set(m.dest[0] * 9 + m.dest[1], m);
      else if (m.kind !== "pawn") wallMoves.push(m);
    }
  }

  for (let r = 0; r < 9; r++) {
    for (let c = 0; c < 9; c++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.gridRow = gridRowOfCell(r);
      cell.style.gridColumn = gridColOfCell(c);
      if (last && last.action < 12) {
        const pawnAt = d.pawns[0][0] === r && d.pawns[0][1] === c ? 0
          : d.pawns[1][0] === r && d.pawns[1][1] === c ? 1 : null;
        const moverOfLast = last.by === "human" ? d.human : 1 - d.human;
        if (pawnAt === moverOfLast) cell.classList.add("last");
      }
      const dest = destByCell.get(r * 9 + c);
      if (dest) {
        cell.classList.add("dest");
        cell.title = "move to " + cellName(r, c);
        cell.addEventListener("click", () => play(dest.action));
      }
      for (const p of [0, 1]) {
        if (d.pawns[p][0] === r && d.pawns[p][1] === c) {
          const pawn = document.createElement("div");
          pawn.className = "pawn p" + p;
          cell.appendChild(pawn);
        }
      }
      board.appendChild(cell);
    }
  }

  const lastWallAnchor = last && last.action >= 12
    ? { anchor: (last.action - (last.action < 76 ? 12 : 76)), h: last.action < 76 }
    : null;
  const placeWall = (anchor, horizontal, cls) => {
    const ar = Math.floor(anchor / 8), ac = anchor % 8;
    const el = document.createElement("div");
    el.className = cls;
    if (horizontal) {
      el.style.gridRow = String(16 - 2 * ar);
      el.style.gridColumn = (2 * ac + 1) + " / span 3";
    } else {
      el.style.gridRow = (15 - 2 * ar) + " / span 3";
      el.style.gridColumn = String(2 * ac + 2);
    }
    board.appendChild(el);
    return el;
  };

  for (const a of d.hwalls) {
    const el = placeWall(a, true, "wall");
    if (lastWallAnchor && lastWallAnchor.h && lastWallAnchor.anchor === a) el.classList.add("last");
  }
  for (const a of d.vwalls) {
    const el = placeWall(a, false, "wall");
    if (lastWallAnchor && !lastWallAnchor.h && lastWallAnchor.anchor === a) el.classList.add("last");
  }

  for (const m of wallMoves) {
    const horizontal = m.kind === "hwall";
    const hit = document.createElement("button");
    hit.className = "hit " + (horizontal ? "h" : "v");
    hit.title = "wall " + m.label;
    hit.setAttribute("aria-label", "place wall " + m.label);
    const ar = Math.floor(m.anchor / 8), ac = m.anchor % 8;
    if (horizontal) {
      hit.style.gridRow = String(16 - 2 * ar);
      hit.style.gridColumn = (2 * ac + 1) + " / span 3";
    } else {
      hit.style.gridRow = (15 - 2 * ar) + " / span 3";
      hit.style.gridColumn = String(2 * ac + 2);
    }
    hit.addEventListener("click", () => play(m.action));
    board.appendChild(hit);
  }
}

function statusText(d) {
  if (d.winner !== null) {
    const won = d.winner === d.human;
    return { text: won ? "You win." : "The engine wins.", cls: "over" };
  }
  if (d.draw) return { text: "Draw — move limit reached.", cls: "over" };
  if (d.to_move === d.human) return { text: "Your move.", cls: "" };
  return { text: "Engine is thinking…", cls: "thinking" };
}

function render(d) {
  state.data = d;
  renderBoard(d);
  renderEval(d);
  renderTopLines(d);
  renderHistory(d);
  const st = statusText(d);
  setStatus(st.text, st.cls);
}

async function play(action) {
  if (state.busy || !state.session) return;
  state.busy = true;
  setError("");
  setStatus("Engine is thinking…", "thinking");

  // optimistic paint of the human move so the reply latency feels right
  const d = state.data;
  const entry = d.legal.find((m) => m.action === action);
  if (entry) {
    if (entry.kind === "pawn" && entry.dest) d.pawns[d.human] = entry.dest.slice();
    else if (entry.kind === "hwall") d.hwalls.push(entry.anchor);
    else if (entry.kind === "vwall") d.vwalls.push(entry.anchor);
    d.legal = [];
    renderBoard(d);
  }

  try {
    const payload = await api("/api/move", { session: state.session, action });
    state.busy = false;
    render(payload);
  } catch (err) {
    state.busy = false;
    setError(String(err.message || err));
    if (state.data) render(state.data);
  }
}

async function newGame() {
  if (state.busy) return;
  state.busy = true;
  setError("");
  setStatus("Setting up the board…", "thinking");
  try {
    const payload = await api("/api/new", {
      human: Number($("side").value),
      sims: Number($("sims").value),
    });
    state.session = payload.session;
    state.busy = false;
    render(payload);
  } catch (err) {
    state.busy = false;
    setStatus("Could not start a game.", "over");
    setError(String(err.message || err));
  }
}

function init() {
  const files = $("files");
  for (let c = 0; c < 9; c++) {
    const el = document.createElement("div");
    el.textContent = FILES[c];
    el.style.gridColumn = gridColOfCell(c);
    files.appendChild(el);
  }
  api("/api/meta")
    .then((meta) => {
      $("engine-line").textContent = "vs " + meta.engine + (meta.step ? " · step " + meta.step : "");
      const opt = [...$("sims").options].find((o) => Number(o.value || o.text) === meta.default_sims);
      if (opt) opt.selected = true;
    })
    .catch(() => { $("engine-line").textContent = "engine offline"; });
  $("new-game").addEventListener("click", newGame);
  newGame();
}

init();
</script>
</body>
</html>
